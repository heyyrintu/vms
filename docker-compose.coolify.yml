x-api-environment: &api-environment
  DJANGO_DEBUG: "false"
  DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Set a long random Django secret}
  FIELD_ENCRYPTION_KEY: ${FIELD_ENCRYPTION_KEY:?Set a Fernet encryption key}
  DJANGO_ALLOWED_HOSTS: ${APP_HOST:?Set the public hostname without https},api,web,127.0.0.1,localhost
  WEB_ORIGIN: ${APP_URL:?Set the public https URL}
  CSRF_TRUSTED_ORIGINS: ${APP_URL:?Set the public https URL}
  DATABASE_URL: postgresql://${SERVICE_USER_POSTGRES}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-vms}
  REDIS_URL: redis://:${SERVICE_PASSWORD_REDIS}@redis:6379/0
  BUSINESS_TIMEZONE: ${BUSINESS_TIMEZONE:-Asia/Kolkata}
  LOGIN_THROTTLE_RATE: ${LOGIN_THROTTLE_RATE:-10/minute}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  SECURE_SSL_REDIRECT: "true"
  SECURE_HSTS_SECONDS: "31536000"
  USE_S3_STORAGE: "true"
  AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-vms-documents}
  AWS_S3_ENDPOINT_URL: http://minio:9000
  AWS_S3_REGION_NAME: ${AWS_S3_REGION_NAME:-us-east-1}
  AWS_S3_ADDRESSING_STYLE: path
  AWS_ACCESS_KEY_ID: ${SERVICE_USER_MINIO}
  AWS_SECRET_ACCESS_KEY: ${SERVICE_PASSWORD_MINIO}
  CLAMAV_HOST: clamav
  CLAMAV_PORT: "3310"
  INTEGRATION_DELIVERY_MODE: ${INTEGRATION_DELIVERY_MODE:-sync}
  EMAIL_PROVIDER: smtp
  SMTP_HOST: ${SMTP_HOST:?Set the SMTP server hostname}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USERNAME: ${SMTP_USERNAME:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:?Set the verified From address}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  SMTP_USE_SSL: ${SMTP_USE_SSL:-false}
  SMTP_TIMEOUT_SECONDS: ${SMTP_TIMEOUT_SECONDS:-20}
  EMAIL_WEBHOOK_TOKEN: ${EMAIL_WEBHOOK_TOKEN:?Set a random inbound email webhook token}
  WHATSAPP_PROVIDER: whatsapp
  WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN:?Set the permanent Meta access token}
  WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:?Set the Meta phone number ID}
  WHATSAPP_API_VERSION: ${WHATSAPP_API_VERSION:-v23.0}
  WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:?Set a random Meta webhook verify token}
  WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:?Set the Meta app secret}
  WHATSAPP_APPROVAL_TEMPLATE_NAME: ${WHATSAPP_APPROVAL_TEMPLATE_NAME:-drona_logitech_approval_review}
  WHATSAPP_APPROVAL_TEMPLATE_LANGUAGE: ${WHATSAPP_APPROVAL_TEMPLATE_LANGUAGE:-en}
  WHATSAPP_FINANCE_TEMPLATE_NAME: ${WHATSAPP_FINANCE_TEMPLATE_NAME:-drona_logitech_finance_ready}
  WHATSAPP_FINANCE_TEMPLATE_LANGUAGE: ${WHATSAPP_FINANCE_TEMPLATE_LANGUAGE:-en}
  WHATSAPP_OPERATIONS_APPROVAL_TEMPLATE_NAME: ${WHATSAPP_OPERATIONS_APPROVAL_TEMPLATE_NAME:-drona_logitech_operations_approval}
  WHATSAPP_OPERATIONS_APPROVAL_TEMPLATE_LANGUAGE: ${WHATSAPP_OPERATIONS_APPROVAL_TEMPLATE_LANGUAGE:-en}
  WHATSAPP_OPERATIONS_PAYMENT_TEMPLATE_NAME: ${WHATSAPP_OPERATIONS_PAYMENT_TEMPLATE_NAME:-drona_logitech_operations_payment}
  WHATSAPP_OPERATIONS_PAYMENT_TEMPLATE_LANGUAGE: ${WHATSAPP_OPERATIONS_PAYMENT_TEMPLATE_LANGUAGE:-en}
  WHATSAPP_OPERATIONS_SETTLEMENT_TEMPLATE_NAME: ${WHATSAPP_OPERATIONS_SETTLEMENT_TEMPLATE_NAME:-drona_logitech_operations_settlement}
  WHATSAPP_OPERATIONS_SETTLEMENT_TEMPLATE_LANGUAGE: ${WHATSAPP_OPERATIONS_SETTLEMENT_TEMPLATE_LANGUAGE:-en}
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:-admin}
  BOOTSTRAP_ADMIN_EMAIL: ${BOOTSTRAP_ADMIN_EMAIL:-}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:-}

x-api-image: &api-image
  build:
    context: ./apps/api
  environment: *api-environment
  init: true

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vms}
      POSTGRES_USER: ${SERVICE_USER_POSTGRES}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  redis:
    image: redis:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${SERVICE_PASSWORD_REDIS}
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2025-06-13T11-33-47Z
    restart: unless-stopped
    command: server /data
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 20s

  minio-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    restart: "no"
    exclude_from_hc: true
    environment:
      MINIO_ROOT_USER: ${SERVICE_USER_MINIO}
      MINIO_ROOT_PASSWORD: ${SERVICE_PASSWORD_MINIO}
      AWS_STORAGE_BUCKET_NAME: ${AWS_STORAGE_BUCKET_NAME:-vms-documents}
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -eu
        mc alias set local http://minio:9000 "$$MINIO_ROOT_USER" "$$MINIO_ROOT_PASSWORD"
        mc mb --ignore-existing "local/$$AWS_STORAGE_BUCKET_NAME"
        mc version enable "local/$$AWS_STORAGE_BUCKET_NAME"

  clamav:
    image: clamav/clamav:1.5.4-debian13-slim
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav
    healthcheck:
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 5m

  migrate:
    <<: *api-image
    restart: "no"
    exclude_from_hc: true
    command: python manage.py migrate --noinput
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api-image
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >-
        python manage.py production_check &&
        exec gunicorn config.wsgi:application
        --bind 0.0.0.0:8000
        --workers $${GUNICORN_WORKERS:-3}
        --timeout 60
        --graceful-timeout 30
        --max-requests 1000
        --max-requests-jitter 100
        --access-logfile -
        --error-logfile -
        --forwarded-allow-ips '*'
    environment:
      <<: *api-environment
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-3}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    expose:
      - "8000"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          request=urllib.request.Request('http://127.0.0.1:8000/api/readiness/',headers={'X-Forwarded-Proto':'https'});
          urllib.request.urlopen(request,timeout=5)
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  worker:
    <<: *api-image
    restart: unless-stopped
    command:
      - /bin/sh
      - -c
      - >-
        exec celery -A config worker -l INFO
        --concurrency=$${CELERY_WORKER_CONCURRENCY:-2}
        --max-tasks-per-child=500
    environment:
      <<: *api-environment
      CELERY_WORKER_CONCURRENCY: ${CELERY_WORKER_CONCURRENCY:-2}
    depends_on:
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "celery -A config inspect ping -d celery@$$HOSTNAME --timeout 5 | grep -q pong"]
      interval: 60s
      timeout: 10s
      retries: 5
      start_period: 60s

  beat:
    <<: *api-image
    restart: unless-stopped
    command: celery -A config beat -l INFO --pidfile=/tmp/celerybeat.pid
    depends_on:
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 60s
      timeout: 5s
      retries: 3

  web:
    build:
      context: ./apps/web
      args:
        API_INTERNAL_URL: http://api:8000
    restart: unless-stopped
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - >-
          fetch('http://127.0.0.1:3000/login').then(response => {
            if (!response.ok) process.exit(1)
          }).catch(() => process.exit(1))
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

volumes:
  postgres_data:
  redis_data:
  minio_data:
  clamav_data:
