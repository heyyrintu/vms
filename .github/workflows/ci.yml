name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: vms_test
          POSTGRES_USER: vms
          POSTGRES_PASSWORD: vms
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vms -d vms_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://vms:vms@127.0.0.1:5432/vms_test
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: apps/api
      - run: ruff check .
        working-directory: apps/api
      - run: python manage.py makemigrations --check --dry-run
        working-directory: apps/api
      - run: python manage.py spectacular --file schema.ci.yml --validate --fail-on-warn
        working-directory: apps/api
      - run: pytest
        working-directory: apps/api

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
        working-directory: apps/web
      - run: npm run lint
        working-directory: apps/web
      - run: npm run format:check
        working-directory: apps/web
      - run: npm run typecheck
        working-directory: apps/web
      - run: npm run build
        working-directory: apps/web

  production-images:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DJANGO_SECRET_KEY: ci-production-check-secret-1234567890
      FIELD_ENCRYPTION_KEY: MDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDAwMDA=
      APP_HOST: vms.example.test
      APP_URL: https://vms.example.test
      SERVICE_USER_POSTGRES: vms
      SERVICE_PASSWORD_POSTGRES: ci-postgres-password
      SERVICE_PASSWORD_REDIS: ci-redis-password
      SERVICE_USER_MINIO: vmsminio
      SERVICE_PASSWORD_MINIO: ci-minio-password
      SMTP_HOST: smtp.example.test
      SMTP_FROM_EMAIL: no-reply@example.test
      EMAIL_WEBHOOK_TOKEN: ci-email-webhook-token
      WHATSAPP_ACCESS_TOKEN: ci-whatsapp-access-token
      WHATSAPP_PHONE_NUMBER_ID: "123456789"
      WHATSAPP_VERIFY_TOKEN: ci-whatsapp-verify-token
      WHATSAPP_APP_SECRET: ci-whatsapp-app-secret
    steps:
      - uses: actions/checkout@v4
      - name: Validate Coolify Compose definition
        shell: bash
        run: sed '/^[[:space:]]*exclude_from_hc:/d' docker-compose.coolify.yml | docker compose -f - config --quiet
      - name: Build production API image
        run: docker build --tag drona-logitech-api:ci apps/api
      - name: Build production web image
        run: docker build --build-arg API_INTERNAL_URL=http://api:8000 --tag drona-logitech-web:ci apps/web

  e2e:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    env:
      DJANGO_SECRET_KEY: ci-only-not-a-production-secret
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
      API_INTERNAL_URL: http://127.0.0.1:8000
      LOGIN_THROTTLE_RATE: 30/minute
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: pip install -r requirements.txt
        working-directory: apps/api
      - run: npm ci
        working-directory: apps/web
      - run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - run: python manage.py migrate && python manage.py seed_demo
        working-directory: apps/api
      - name: Browser smoke tests
        shell: bash
        run: |
          (cd apps/api && python manage.py runserver 127.0.0.1:8000 > /tmp/vms-api.log 2>&1) &
          (cd apps/web && npm run dev -- --hostname 127.0.0.1 > /tmp/vms-web.log 2>&1) &
          for attempt in {1..60}; do
            curl --fail --silent http://127.0.0.1:3000/login > /dev/null && break
            sleep 1
          done
          if ! curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then
            cat /tmp/vms-api.log /tmp/vms-web.log
            exit 1
          fi
          cd apps/web
          npm run test:e2e
          cd ../..
          python infra/load_smoke.py --base-url http://127.0.0.1:8000 --requests 40 --concurrency 5

  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
