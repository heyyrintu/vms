components:
  schemas:
    ActionEnum:
      enum:
      - SUBMIT
      - APPROVE
      - REJECT
      - SEND_BACK
      - CANCEL
      - REOPEN
      type: string
      description: |-
        * `SUBMIT` - Submit
        * `APPROVE` - Approve
        * `REJECT` - Reject
        * `SEND_BACK` - Send back
        * `CANCEL` - Cancel
        * `REOPEN` - Reopen
    AllocationInput:
      type: object
      properties:
        approval_item_id:
          type: integer
          minimum: 1
        gross_amount_allocated:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        tds_allocated:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
        net_cash_allocated:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
      required:
      - approval_item_id
      - gross_amount_allocated
      - net_cash_allocated
      - tds_allocated
    ApprovalAction:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        action:
          $ref: '#/components/schemas/ActionEnum'
        scope:
          $ref: '#/components/schemas/ScopeEnum'
        comment:
          type: string
        approval_stage:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        captured_totals: {}
        created_at:
          type: string
          format: date-time
          readOnly: true
        actor:
          type: integer
        batch:
          type: integer
        item:
          type: integer
          nullable: true
      required:
      - action
      - actor
      - actor_name
      - batch
      - created_at
      - id
      - scope
    ApprovalBatch:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        requester_name:
          type: string
          readOnly: true
        client_name:
          type: string
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalItem'
          readOnly: true
        actions:
          type: array
          items:
            $ref: '#/components/schemas/ApprovalAction'
          readOnly: true
        vendor_subtotals:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        stage_decisions:
          type: array
          items:
            type: object
            additionalProperties: {}
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        approval_no:
          type: string
          readOnly: true
        submitted_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status:
          allOf:
          - $ref: '#/components/schemas/ApprovalBatchStatusEnum'
          readOnly: true
        revision_no:
          type: integer
          readOnly: true
        current_stage:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        revision_diff: {}
        approval_rule_snapshot:
          readOnly: true
        gross_requested:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          readOnly: true
        tds_requested:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          readOnly: true
        net_requested:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,2})?$
          readOnly: true
        purpose:
          type: string
          maxLength: 30
        client:
          type: integer
        requested_by:
          type: integer
          readOnly: true
        supersedes:
          type: integer
          nullable: true
      required:
      - actions
      - approval_no
      - approval_rule_snapshot
      - client
      - client_name
      - created_at
      - gross_requested
      - id
      - items
      - net_requested
      - requested_by
      - requester_name
      - revision_no
      - stage_decisions
      - status
      - submitted_at
      - tds_requested
      - updated_at
      - vendor_subtotals
    ApprovalBatchCreate:
      type: object
      properties:
        submit:
          type: boolean
          writeOnly: true
          default: false
        trip_ids:
          type: array
          items:
            type: integer
            minimum: 1
          minItems: 1
        purpose:
          allOf:
          - $ref: '#/components/schemas/ApprovalBatchCreatePurposeEnum'
          default: ADVANCE
      required:
      - trip_ids
    ApprovalBatchCreatePurposeEnum:
      enum:
      - ADVANCE
      - FINAL_SETTLEMENT
      - OTHER
      type: string
      description: |-
        * `ADVANCE` - ADVANCE
        * `FINAL_SETTLEMENT` - FINAL_SETTLEMENT
        * `OTHER` - OTHER
    ApprovalBatchStatusEnum:
      enum:
      - DRAFT
      - PENDING
      - CHANGES_REQUESTED
      - PARTIALLY_APPROVED
      - APPROVED
      - REJECTED
      - CANCELLED
      - SUPERSEDED
      type: string
      description: |-
        * `DRAFT` - Draft
        * `PENDING` - Pending
        * `CHANGES_REQUESTED` - Changes requested
        * `PARTIALLY_APPROVED` - Partially approved
        * `APPROVED` - Approved
        * `REJECTED` - Rejected
        * `CANCELLED` - Cancelled
