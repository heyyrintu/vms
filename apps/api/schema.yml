          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        reason:
          type: string
          maxLength: 240
        resolved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        message:
          type: integer
        resolved_by:
          type: integer
          readOnly: true
          nullable: true
      required:
      - created_at
      - id
      - message
      - message_detail
      - reason
      - resolved_at
      - resolved_by
      - updated_at
