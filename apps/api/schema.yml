      - CANCELLED
      - CANCELLED_WITH_PAYMENT
      type: string
      description: |-
        * `DRAFT` - Draft
        * `READY` - Ready
        * `ADVANCE_APPROVAL_PENDING` - Advance approval pending
        * `ADVANCE_APPROVED` - Advance approved
        * `ADVANCE_PARTIALLY_PAID` - Advance partially paid
        * `ADVANCE_PAID` - Advance paid
        * `DEPLOYED` - Deployed
        * `IN_TRANSIT` - In transit
        * `DELIVERED` - Delivered
        * `SETTLEMENT_PENDING` - Settlement pending
        * `SETTLEMENT_APPROVAL_PENDING` - Settlement approval pending
        * `SETTLED` - Settled
        * `CANCELLED` - Cancelled
        * `CANCELLED_WITH_PAYMENT` - Cancelled with payment
    UnmappedInbound:
